name: Update profile stats

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "alim-ul-karim-profile.md"
      - "scripts/update-profile-stats.js"
      - ".github/workflows/update-profile-stats.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git rev-list)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run update-profile-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_AUTHORS: ${{ vars.PROFILE_AUTHORS || format('{0}', github.repository_owner) }}
        run: node scripts/update-profile-stats.js

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md alim-ul-karim-profile.md; then
            echo "No README/profile changes — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md alim-ul-karim-profile.md
          git commit -m "chore: update profile stats [skip ci]"
          git push
